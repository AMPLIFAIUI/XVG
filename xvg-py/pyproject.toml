[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "xvg"
version = "1.0.0"
description = "XVG 1.0 Tesseract bindings"
requires-python = ">=3.8"
classifiers = ["Programming Language :: Python :: 3"]
dynamic = ["version"]

[tool.maturin]
python-source = "python"
module-name = "xvg"
target-dir = "S:/xvg-tesseract/target" 