[package]
name = "xvg-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xvg-core = { path = "../xvg-core" }
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"

[features]
default = []
sdf = [ ]
shader = [ ]
three_d = [ ]
crdt = [ ]
compression = [ ]

