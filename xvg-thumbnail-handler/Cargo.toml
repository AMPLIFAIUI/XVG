[package]
name = "xvg-thumbnail-handler"
version = "0.1.0"
edition = "2021"
description = "Windows thumbnail and preview handler for XVG files"

[lib]
name = "xvg_thumbnail_handler"
crate-type = ["cdylib"]

[dependencies]
xvg-core = { path = "../xvg-core" }
xvg-runtime = { path = "../xvg-runtime" }
windows = { version = "0.52", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
image = "0.24"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
