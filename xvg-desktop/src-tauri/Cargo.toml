[package]
name = "xvg-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
tauri-plugin-dialog = "2.5"
tauri-plugin-fs = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
image = "0.24"
usvg = "0.36"
tiny-skia = "0.11"
glow = "0.13"
xvg-core = { path = "../../xvg-core", features = ["svg", "3d", "serde"] }

[[bin]]
name = "xvg-desktop"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]
