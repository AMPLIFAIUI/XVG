<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XVG Desktop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .file-drop-zone {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px;
            margin: 20px 0;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-drop-zone:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .file-drop-zone.dragover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: scale(1.02);
        }

        .file-icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 15px;
        }

        .file-text {
            font-size: 1.1rem;
            color: #666;
        }

        .button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .file-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .file-info h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .file-info p {
            color: #666;
            margin: 5px 0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">XVG Desktop</div>
        <div class="subtitle">XVG 1.0 "Tesseract" File Editor</div>
        
        <div class="file-drop-zone" id="dropZone">
            <div class="file-icon">📁</div>
            <div class="file-text">Drop XVG files here or click to browse</div>
        </div>

        <div class="file-info hidden" id="fileInfo">
            <h3>File Information</h3>
            <p id="fileName"></p>
            <p id="fileSize"></p>
            <p id="fileDimensions"></p>
        </div>

        <div class="file-info hidden" id="previewContainer">
            <h3>Preview</h3>
            <canvas id="previewCanvas" style="max-width: 100%; border: 1px solid #ddd; border-radius: 5px;"></canvas>
        </div>

        <div class="status hidden" id="status"></div>

        <div>
            <button class="button" id="openBtn">Open File</button>
            <button class="button" id="saveBtn" disabled>Save</button>
            <button class="button" id="exportBtn" disabled>Export</button>
        </div>
    </div>

    <script type="module">
        // Import XVG WASM module
        import * as xvg from "https://unpkg.com/xvg@1/wasm.js";
        
        let currentFile = null;
        let xvgData = null;

        // File drop zone functionality
        const dropZone = document.getElementById('dropZone');
        const fileInfo = document.getElementById('fileInfo');
        const previewContainer = document.getElementById('previewContainer');
        const previewCanvas = document.getElementById('previewCanvas');
        const status = document.getElementById('status');
        const openBtn = document.getElementById('openBtn');
        const saveBtn = document.getElementById('saveBtn');
        const exportBtn = document.getElementById('exportBtn');

        // Drag and drop events
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        dropZone.addEventListener('click', () => {
            openFile();
        });

        // Button event listeners
        openBtn.addEventListener('click', openFile);
        saveBtn.addEventListener('click', saveFile);
        exportBtn.addEventListener('click', exportFile);

        async function openFile() {
            try {
                // Create file input for browser
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.xvg,.svg,.png,.jpg,.jpeg';
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        await handleFile(file);
                    }
                };
                input.click();
            } catch (error) {
                showStatus('Error opening file: ' + error, 'error');
            }
        }

        async function handleFile(file) {
            try {
                showStatus('Loading file with XVG WASM...', 'success');
                
                // Read file as ArrayBuffer
                const arrayBuffer = await file.arrayBuffer();
                
                // Load with XVG WASM
                xvgData = xvg.load(arrayBuffer);
                
                // Get file info
                const fileSize = file.size;
                const fileName = file.name;
                const dimensions = `${xvgData.header.width}x${xvgData.header.height}`;
                
                // Display file info
                document.getElementById('fileName').textContent = `Name: ${fileName}`;
                document.getElementById('fileSize').textContent = `Size: ${formatFileSize(fileSize)}`;
                document.getElementById('fileDimensions').textContent = `Dimensions: ${dimensions}`;
                
                fileInfo.classList.remove('hidden');
                saveBtn.disabled = false;
                exportBtn.disabled = false;
                currentFile = file;
                
                // Show preview
                await showPreview();
                
                showStatus('XVG file loaded successfully with WASM!', 'success');
            } catch (error) {
                showStatus('Error processing file: ' + error, 'error');
                console.error('XVG WASM Error:', error);
            }
        }

        async function saveFile() {
            if (!currentFile) return;
            
            try {
                showStatus('Saving file...', 'success');
                // Add actual save functionality here
                await new Promise(resolve => setTimeout(resolve, 1000));
                showStatus('File saved successfully!', 'success');
            } catch (error) {
                showStatus('Error saving file: ' + error, 'error');
            }
        }

        async function exportFile() {
            if (!currentFile || !xvgData) return;
            
            try {
                showStatus('Rendering with XVG WASM...', 'success');
                
                // Render the XVG file to PNG using WASM
                const rendered = xvgData.render({width: xvgData.header.width, height: xvgData.header.height});
                
                // Create download link
                const blob = new Blob([rendered.data], {type: 'image/png'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = currentFile.name.replace(/\.[^/.]+$/, '.png');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showStatus('File exported as PNG successfully!', 'success');
            } catch (error) {
                showStatus('Error exporting file: ' + error, 'error');
                console.error('Export Error:', error);
            }
        }

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
            status.classList.remove('hidden');
            
            setTimeout(() => {
                status.classList.add('hidden');
            }, 3000);
        }

        async function showPreview() {
            if (!xvgData) return;
            
            try {
                // Render the XVG file
                const rendered = xvgData.render({width: xvgData.header.width, height: xvgData.header.height});
                
                // Set canvas size
                previewCanvas.width = xvgData.header.width;
                previewCanvas.height = xvgData.header.height;
                
                // Draw the rendered image
                const ctx = previewCanvas.getContext('2d');
                const imageData = new ImageData(rendered.data, rendered.width, rendered.height);
                ctx.putImageData(imageData, 0, 0);
                
                previewContainer.classList.remove('hidden');
            } catch (error) {
                console.error('Preview Error:', error);
                showStatus('Error showing preview: ' + error, 'error');
            }
        }

        function formatFileSize(bytes) {
            if (bytes === 'Unknown') return 'Unknown';
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            if (bytes === 0) return '0 Bytes';
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Initialize app
        showStatus('XVG Desktop ready!', 'success');
    </script>
</body>
</html>
