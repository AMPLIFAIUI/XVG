[package]
name = "xvg-desktop"
version = "1.0.0"
edition = "2021"
authors = ["xvg-team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/amplifaiui/xvg-tesseract"

[dependencies]
xvg-core = { path = "../xvg-core", features = ["serde", "compression", "gpu", "3d"] }
eframe = { version = "0.28.0", features = ["default_fonts", "glow"] }
egui_dock = "0.5.0"
rfd = "0.14.0"
image = "0.24"
kurbo = "0.9"
usvg = { version = "0.36", features = ["text"] }
tiny-skia-path = "0.11"
tiny-skia = "0.11"
resvg = { version = "0.36", features = ["text"] }
bincode = "1.3"
anyhow = "1.0"
zstd = "0.13"
thiserror = "1.0"
env_logger = "0.10"
serde_json = "1.0"
dirs = "5.0"
open = "5.3"
async-trait = "0.1"
tokio = { version = "1.0", features = ["fs", "rt", "macros"] }

 