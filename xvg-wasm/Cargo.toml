[package]
name = "xvg-wasm"
version = "1.0.0"
edition = "2021"
[lib]
crate-type = ["cdylib"]
[dependencies]
xvg-core = { path = "../xvg-core", features = ["serde", "compression", "svg", "3d", "std"], default-features = false }
wasm-bindgen = "0.2.88"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
base64 = "0.21"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false 