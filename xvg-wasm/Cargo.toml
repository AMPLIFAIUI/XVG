[package]
name = "xvg-wasm"
version = "1.0.0"
edition = "2021"
authors = ["xvg-team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/amplifaiui/xvg-tesseract"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
anyhow = "1.0"

# Use the unified runtime
xvg-runtime = { path = "../xvg-runtime", features = ["wasm"] }
serde_json = "1.0"

# The `console_error_panic_hook` crate provides better error messages in debug builds.
[dependencies.web-sys]
version = "0.3"
features = [
  'console',
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
